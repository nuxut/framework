# nuxut-palette ({{scheme}}, {{mode}}, kaynak {{source}}).
# Kullanım: hyprland.conf içine  source = <XDG_STATE_HOME>/nuxut/exports/hyprland.conf
$nuxut_primary = {{colors.primary.default.hypr}}
$nuxut_on_primary = {{colors.on_primary.default.hypr}}
$nuxut_secondary = {{colors.secondary.default.hypr}}
$nuxut_tertiary = {{colors.tertiary.default.hypr}}
$nuxut_surface = {{colors.surface.default.hypr}}
$nuxut_outline = {{colors.outline_variant.default.hypr}}
$nuxut_error = {{colors.error.default.hypr}}

general {
    col.active_border = {{colors.primary.default.hypr}} {{colors.tertiary.default.hypr}} 45deg
    col.inactive_border = {{colors.outline_variant.default.hypr}}
}

group {
    col.border_active = {{colors.secondary.default.hypr}}
    col.border_inactive = {{colors.outline_variant.default.hypr}}
}
