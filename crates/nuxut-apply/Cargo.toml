[package]
name = "nuxut-apply"
description = "Nuxut: dış yapılandırma uygulama katmanı — güvenli atomik yazım, parça düzenleyicileri, snapshot/geri yükleme (shell ADR-0001)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nuxut-config.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
blake3.workspace = true
# Biçim/yorum koruyan TOML düzenleme (toml 1 ile aynı toml_parser/toml_writer'ı paylaşır).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

# Dosya sahibi denetimi (geteuid) için; Unix dışı hedeflerde gerekmiyor.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
# Gerçek ev dizini (getpwuid_r; $HOME taklit edilebilir) — test örneği kapısı için. Ağaçta zaten var
# (nuxut-render), yalnızca `user` özelliği eklenir.
nix = { version = "0.31", default-features = false, features = ["user"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
